name: Verify public digital CV
on:
  pull_request:
    paths:
      - 'api/veteran/**'
      - 'api/_lib/digital-cv-page.js'
      - 'test/digital-cv-page.test.js'
      - 'scripts/verify-public-cv.cjs'
      - 'scripts/fixtures/public-cv.cjs'
      - '.github/workflows/public-cv.yml'
  push:
    branches: [main]
    paths:
      - 'api/veteran/**'
      - 'api/_lib/digital-cv-page.js'
      - 'test/digital-cv-page.test.js'
      - 'scripts/verify-public-cv.cjs'
      - 'scripts/fixtures/public-cv.cjs'
      - '.github/workflows/public-cv.yml'
permissions:
  contents: read
concurrency:
  group: public-cv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Verify the backend and public snapshot rendering
        run: npm test
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/public-cv-browser" --no-save --package-lock=false playwright@1.64.1
          "$RUNNER_TEMP/public-cv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify responsive layouts and produce fictional examples
        env:
          NODE_PATH: ${{ runner.temp }}/public-cv-browser/node_modules
        run: node scripts/verify-public-cv.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-cv-fictional-previews
          path: public-cv-previews
          retention-days: 3
          if-no-files-found: ignore
